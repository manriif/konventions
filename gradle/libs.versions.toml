[versions]

# Project version
konventions = "0.0.3"

# Jvm toolchain
jvm-toolchain = "17"

# Libs
android-gradlePlugin = "9.3.0"
dokka = "2.3.0"
foojay-resolver = "1.0.0"
gradle-pluginPublish = "2.2.1"
kotlin = "2.4.21"
vanniktech-mavenPublish = "0.37.0"

[libraries]

android-gradlePlugin = { module = "com.android.tools.build:gradle", version.ref = "android-gradlePlugin" }
dokka-gradlePlugin = { module = "org.jetbrains.dokka:dokka-gradle-plugin", version.ref = "dokka" }
foojay-resolver = { module = "org.gradle.toolchains:foojay-resolver", version.ref = "foojay-resolver" }
gradle-pluginPublish = { module = "com.gradle.publish:plugin-publish-plugin", version.ref = "gradle-pluginPublish" }
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
vanniktech-mavenPublish = { module = "com.vanniktech:gradle-maven-publish-plugin", version.ref = "vanniktech-mavenPublish" }
